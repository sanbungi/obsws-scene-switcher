name: Test and package

on:
  pull_request:
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock
      - 'packaging/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - '**.py'
      - pyproject.toml
      - uv.lock
      - 'packaging/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Platform to build
        required: true
        default: ubuntu
        type: choice
        options:
          - ubuntu
          - windows
          - both

permissions:
  contents: read

jobs:
  ubuntu:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'ubuntu' ||
      inputs.target == 'both'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: true
      - run: uv python install 3.14
      - name: Apply tag version to build checkout
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          uv version "$version" --no-sync
          test "$(uv version --short)" = "$version"
      - run: uv sync --locked --group dev --group build
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox weston x11-utils libegl1 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxkbcommon-x11-0 libxcb-xkb1 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libdbus-1-3 libfontconfig1
      - name: Unit and Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      - name: X11 integration
        run: xvfb-run -a sh -c 'openbox & QT_QPA_PLATFORM=xcb OBS_TEST_X11=1 uv run pytest tests/test_x11_integration.py -q'
      - name: Build deb
        run: uv run python packaging/build.py linux
      - name: Install and launch deb with xcb and Wayland
        run: |
          sudo apt-get install -y ./dist/*.deb
          xvfb-run -a env QT_QPA_PLATFORM=xcb timeout 30 obs-scene-switcher --smoke-test
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=wayland-test --idle-time=0 --log="$RUNNER_TEMP/weston.log" &
          weston_pid=$!
          trap 'kill "$weston_pid" || true' EXIT
          for i in $(seq 1 50); do
            test ! -S "$XDG_RUNTIME_DIR/wayland-test" || break
            sleep .1
          done
          QT_QPA_PLATFORM=wayland WAYLAND_DISPLAY=wayland-test timeout 30 obs-scene-switcher --smoke-test
          sudo apt-get remove -y obs-scene-switcher
          test -f "$HOME/.config/obs-kwin-switcher/config.json"
      - name: Checksums
        run: uv run python packaging/build.py checksums
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  windows:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.target == 'windows' || inputs.target == 'both'))
    timeout-minutes: 30
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.28'
          enable-cache: true
      - run: uv python install 3.14
      - name: Apply tag version to build checkout
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          uv version "$version" --no-sync
          test "$(uv version --short)" = "$version"
      - run: uv sync --locked --group dev --group build
      - name: Unit and Qt tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      - name: Inno Setup path
        shell: pwsh
        run: '"C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Append'
      - name: Build Windows executables
        run: uv run python packaging/build.py windows
      - name: Windows launch and installer smoke tests
        shell: pwsh
        run: |
          function Check-Process($exe, $arguments) {
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru
            if (-not $process.WaitForExit(60000)) { $process.Kill(); throw "Timed out: $exe" }
            if ($process.ExitCode -ne 0) { throw "Failed: $exe ($($process.ExitCode))" }
          }
          $portable = Get-ChildItem dist/*-windows-x64.exe | Select-Object -First 1
          Check-Process $portable.FullName '--smoke-test'
          $installer = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Check-Process $installer.FullName '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          $app = "$env:LOCALAPPDATA\Programs\OBS Scene Switcher"
          Check-Process "$app\obs-scene-switcher.exe" '--smoke-test'
          Check-Process $installer.FullName '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          Check-Process "$app\unins000.exe" '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          if (!(Test-Path "$env:APPDATA\obs-scene-switcher\config.json")) { throw 'Settings were removed' }
      - name: Checksums
        run: uv run python packaging/build.py checksums
      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ubuntu, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: artifacts
      - name: Combine and verify artifacts
        run: |
          mkdir release
          cp artifacts/packages-linux/*.deb release/
          cp artifacts/packages-windows/*.exe release/
          cat artifacts/packages-linux/SHA256SUMS artifacts/packages-windows/SHA256SUMS > release/SHA256SUMS
          cd release
          sha256sum --check SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          fi
